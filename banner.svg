<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Danylton Lima — Software Engineer</title>
  <desc id="d">Danylton Lima, Software Engineer com foco em front-end e atuação full-stack. Tiix · ADS na UERJ-ZO · Rio de Janeiro.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A101D"/>
      <stop offset="1" stop-color="#101B31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#94A3B8" fill-opacity="0.13"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dotsMask"><rect x="560" width="640" height="300" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="1200" height="300" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect x="560" width="640" height="300" fill="url(#dots)" mask="url(#dotsMask)"/>
    <circle cx="935" cy="150" r="250" fill="url(#glow)"/>
    <rect width="1200" height="4" fill="url(#accent)"/>
  </g>

  <!-- texto -->
  <text x="72" y="80" class="sans" font-size="15" font-weight="600" letter-spacing="4" fill="#5EEAD4">SOFTWARE ENGINEER</text>
  <text x="70" y="146" class="sans" font-size="64" font-weight="700" fill="#F8FAFC">Danylton Lima<tspan class="cursor" fill="#2DD4BF" dx="4">_</tspan></text>
  <text x="72" y="188" class="sans" font-size="22" fill="#94A3B8">Front-end · Full-stack · React, TypeScript &amp; PHP</text>

  <g class="sans" font-size="15" fill="#CBD5E1" text-anchor="middle">
    <rect x="72" y="214" width="72" height="30" rx="15" fill="#2DD4BF" fill-opacity="0.08" stroke="#2DD4BF" stroke-opacity="0.45"/>
    <text x="108" y="234">Tiix</text>
    <rect x="154" y="214" width="150" height="30" rx="15" fill="#2DD4BF" fill-opacity="0.08" stroke="#2DD4BF" stroke-opacity="0.45"/>
    <text x="229" y="234">ADS · UERJ-ZO</text>
    <rect x="314" y="214" width="150" height="30" rx="15" fill="#2DD4BF" fill-opacity="0.08" stroke="#2DD4BF" stroke-opacity="0.45"/>
    <text x="389" y="234">Rio de Janeiro</text>
  </g>

  <!-- janela de interface -->
  <g>
    <rect x="740" y="46" width="388" height="208" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
    <path d="M740 74 H1128" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="760" cy="60" r="5" fill="#F87171" fill-opacity="0.85"/>
    <circle cx="777" cy="60" r="5" fill="#FBBF24" fill-opacity="0.85"/>
    <circle cx="794" cy="60" r="5" fill="#34D399" fill-opacity="0.85"/>
    <rect x="816" y="52" width="170" height="16" rx="8" fill="#1E293B"/>
    <text x="830" y="64" class="mono" font-size="10.5" fill="#64748B">localhost:5173</text>

    <rect x="756" y="88" width="70" height="152" rx="8" fill="#111C30"/>
    <rect x="768" y="102" width="46" height="6" rx="3" fill="url(#accent)"/>
    <rect x="768" y="118" width="40" height="6" rx="3" fill="#1E293B"/>
    <rect x="768" y="134" width="44" height="6" rx="3" fill="#1E293B"/>
    <rect x="768" y="150" width="34" height="6" rx="3" fill="#1E293B"/>

    <rect x="838" y="88" width="274" height="70" rx="8" fill="#13203A"/>
    <rect x="852" y="102" width="132" height="10" rx="5" fill="#E2E8F0" fill-opacity="0.85"/>
    <rect x="852" y="120" width="190" height="6" rx="3" fill="#334155"/>
    <rect x="852" y="134" width="66" height="16" rx="8" fill="url(#accent)"/>

    <g fill="#111C30" stroke="#1E293B">
      <rect x="838" y="168" width="84" height="72" rx="8"/>
      <rect x="933" y="168" width="84" height="72" rx="8"/>
      <rect x="1028" y="168" width="84" height="72" rx="8"/>
    </g>
    <g fill="#2DD4BF" fill-opacity="0.25">
      <circle cx="858" cy="188" r="8"/>
      <circle cx="953" cy="188" r="8"/>
      <circle cx="1048" cy="188" r="8"/>
    </g>
    <g fill="#334155">
      <rect x="850" y="206" width="56" height="6" rx="3"/>
      <rect x="850" y="220" width="40" height="6" rx="3"/>
      <rect x="945" y="206" width="56" height="6" rx="3"/>
      <rect x="945" y="220" width="44" height="6" rx="3"/>
      <rect x="1040" y="206" width="56" height="6" rx="3"/>
      <rect x="1040" y="220" width="36" height="6" rx="3"/>
    </g>
  </g>

  <!-- trecho de código -->
  <g>
    <rect x="690" y="222" width="250" height="44" rx="10" fill="#0A101D" stroke="#1E293B" stroke-width="1.5"/>
    <text x="708" y="249" class="mono" font-size="13.5"><tspan fill="#F472B6">const</tspan><tspan fill="#E2E8F0"> foco = </tspan><tspan fill="#5EEAD4">"front-end"</tspan><tspan fill="#94A3B8">;</tspan></text>
  </g>
</svg>
